<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLOPASS Vector Studio — Core Tests</title>
    <style>
        body {
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            background: #09090b;
            color: #e4e4e7;
            max-width: 780px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h1 { font-size: 1.25rem; margin-bottom: 6px; }
        .summary {
            padding: 12px 16px;
            border-radius: 10px;
            margin: 16px 0;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid #27272a;
            background: #18181b;
        }
        .summary.ok { border-color: #10b981; color: #34d399; }
        .summary.fail { border-color: #ef4444; color: #f87171; }
        .case {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 14px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: #121216;
            border: 1px solid #27272a;
            font-size: 0.85rem;
        }
        .badge {
            font-family: ui-monospace, monospace;
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 999px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .pass { background: rgba(16, 185, 129, 0.16); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
        .err { background: rgba(239, 68, 68, 0.16); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
        .err-msg { color: #fca5a5; font-family: ui-monospace, monospace; font-size: 0.75rem; margin-top: 4px; }
    </style>
</head>
<body>
    <h1>SOLOPASS Vector Studio — Core Unit Tests</h1>
    <div id="summary" class="summary">Running tests...</div>
    <div id="results"></div>

    <script type="module">
        import { runAllTests } from './core.test.js';

        const results = runAllTests();
        const passed = results.filter(r => r.passed).length;
        const failed = results.length - passed;

        const summaryEl = document.getElementById('summary');
        summaryEl.textContent = `${passed}/${results.length} tests passed (${failed} failed)`;
        summaryEl.className = `summary ${failed === 0 ? 'ok' : 'fail'}`;
        summaryEl.dataset.passed = String(passed);
        summaryEl.dataset.failed = String(failed);

        const listEl = document.getElementById('results');
        for (const r of results) {
            const row = document.createElement('div');
            row.className = 'case';
            const left = document.createElement('div');
            left.textContent = r.name;
            if (!r.passed && r.error) {
                const errDiv = document.createElement('div');
                errDiv.className = 'err-msg';
                errDiv.textContent = r.error;
                left.appendChild(errDiv);
            }
            const badge = document.createElement('span');
            badge.className = `badge ${r.passed ? 'pass' : 'err'}`;
            badge.textContent = r.passed ? 'PASS' : 'FAIL';
            row.appendChild(left);
            row.appendChild(badge);
            listEl.appendChild(row);
        }
    </script>
</body>
</html>
